<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My Online Learning Platform</title>
</head>
<body>
    <header>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="nav-link">Profile</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="nav-link">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link">Login</a>
                <a href="{% url 'register' %}" class="nav-link">Register</a>
            {% endif %}
            <h1><a href="{% url 'home' %}">Welcome to OLP</a></h1>
        </nav>
    </header>

    <main>
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        &copy; 2024 Online Learning Platform
    </footer>
</body>
</html>
